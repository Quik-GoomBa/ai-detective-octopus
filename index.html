document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<!-- 앱_AI탐정단_v18 | 변경: 크롬북 가로 2분할 복구, 자동저장·이어하기, 보고서 인쇄 빈 페이지 수정 -->\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"d693e362-cfad-4cb1-9fcd-c1e24c2efb8e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <style>\n    @keyframes badgePop{0%{transform:scale(.4);}55%{transform:scale(1.35);}100%{transform:scale(1);}}\n    @keyframes btnPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}\n    @keyframes hintFade{from{opacity:.45;}to{opacity:.95;}}\n    @keyframes stageIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}\n    @keyframes fillGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}\n    @keyframes iconFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}\n    @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(0,150,136,.28);}70%{box-shadow:0 0 0 10px rgba(0,150,136,0);}100%{box-shadow:0 0 0 0 rgba(0,150,136,0);}}\n    @keyframes sparklePop{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.15) rotate(8deg);}}\n    @keyframes petalSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}\n    body{margin:0;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"appRoot\" style=\"min-height:100vh;background:#f8f7fc;\"><\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  componentDidMount(){\n    this.injectStyle();\n    this.injectMarkup();\n    this.wireApp();\n  }\n\n  injectStyle(){\n    if(document.getElementById('__ai_detective_style'))return;\n    const css = `\n:root{\n  --ink:#1d1d1f;--ink-soft:#3c3c3e;--muted:#6e6e73;\n  --line:#e2e2e5;--bg:#f5f5f7;--card:#fff;\n  --blue:#00968a;--blue-soft:#e6f6f4;--blue-mid:#bfe8e2;\n  --trust:#059669;--trust-soft:#d1fae5;\n  --hold:#d97706;--hold-soft:#fef3c7;\n  --doubt:#dc2626;--doubt-soft:#fee2e2;\n  --brand:#00968a;--brand2:#00968a;--brand-ink:#0b3d38;\n  --header-bg:#0b3d38;\n  --gold:#00968a;--pink:#e5177b;--pink-soft:#fde8f2;--leaf:#3fa535;\n  --stat-det:#00968a;--stat-det-soft:#e6f6f4;\n  --radius:18px;--radius-sm:12px;\n  --sh:0 1px 3px rgba(0,0,0,.07);\n}\n*{box-sizing:border-box;margin:0;padding:0;}\nbody{font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}\nbutton,input,textarea{font-family:inherit;}\n.serif{font-family:inherit;}\n\n/* ── 상단 능력치 바 ── */\n.stat-bar{position:sticky;top:0;z-index:101;background:var(--header-bg);padding:7px 16px;display:none;}\n.stat-bar.show{display:block;}\n.stat-bar-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:5px;}\n.stat-row{display:flex;align-items:center;gap:12px;width:100%;}\n.stat-label{font-size:11px;font-weight:800;color:rgba(255,255,255,.78);white-space:nowrap;min-width:52px;}\n.stat-track{flex:1;max-width:260px;height:7px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}\n.stat-fill{height:100%;border-radius:999px;background:var(--brand);transform-origin:left;transition:width .4s cubic-bezier(.34,1.56,.64,1);}\n.stat-val{font-size:13px;font-weight:900;color:#fff;min-width:28px;}\n.stat-progress{font-size:11px;color:rgba(255,255,255,.55);margin-left:auto;white-space:nowrap;}\n.care-badges{display:flex;gap:6px;flex:1;flex-wrap:nowrap;}\n.care-badge{font-size:13px;width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);filter:grayscale(1);opacity:.38;transition:all .3s;cursor:default;}\n.care-badge.earned{filter:none;opacity:1;background:rgba(229,23,123,.22);border-color:rgba(229,23,123,.6);}\n.care-badge.pop{animation:badgePop .55s cubic-bezier(.34,1.56,.64,1);}\n.care-count{font-size:11px;font-weight:900;color:#7fd9cf;min-width:28px;text-align:right;}\n\n/* ── 검색 상단바 ── */\n.topbar{background:var(--header-bg);position:sticky;top:0;z-index:100;}\n.stat-bar.show ~ .topbar, .stat-bar.show + .topbar{top:64px;}\n.topbar-inner{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:1080px;margin:0 auto;}\n.brand-logo{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:-.4px;padding:6px 4px;}\n.searchbox{flex:1;max-width:540px;background:#fff;border-radius:24px;display:flex;align-items:center;padding:0 15px;height:40px;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.16);}\n.searchbox input{border:0;outline:0;font-size:14px;flex:1;background:transparent;color:#222;}\n.nav-tabs{background:#fff;border-bottom:1px solid #e5e9e8;display:flex;align-items:center;padding:0 16px;overflow-x:auto;box-shadow:0 1px 0 rgba(0,150,138,.05);}\n.nav-tab{padding:11px 15px;font-size:13px;color:#928da8;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600;}\n.nav-tab.active{color:var(--brand);font-weight:800;border-bottom-color:var(--brand);}\n\n/* ── 레이아웃 ── */\n.main-wrap{max-width:1080px;margin:0 auto;padding:20px 16px 180px;display:grid;grid-template-columns:1fr 290px;gap:22px;}\n@media(max-width:740px){.main-wrap{grid-template-columns:1fr;}.sidebar{display:none;}}\n\n/* ── AI 패널 ── */\n.ai-panel{background:var(--card);border-radius:var(--radius);border:1.5px solid var(--blue-mid);box-shadow:var(--sh);overflow:hidden;}\n.ai-hd{background:var(--header-bg);padding:13px 18px;display:flex;align-items:center;gap:8px;}\n.ai-badge{background:var(--pink);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;gap:4px;}\n.ai-badge svg{animation:sparklePop 2.4s ease-in-out infinite;}\n.ai-hd-txt{color:#fff;font-size:13px;font-weight:700;}\n.ai-body{padding:19px 21px;line-height:1.9;font-size:15px;color:var(--ink);}\n.hl{display:inline;border-bottom:2px solid transparent;border-radius:3px;padding:1px 2px;cursor:default;transition:background .15s,border-color .15s;}\n.hunt .hl{backgrou header class=\"topbar\">\n  <div class=\"topbar-inner\">\n    <div class=\"brand-logo\">스마트 검색 AI<\u002Fdiv>\n    <div class=\"searchbox\">\n      <input value=\"문어는 정말 똑똑할까?\" readonly/>\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00968a\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.2\" y2=\"16.2\"><\u002Fline><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n<nav class=\"nav-tabs\">\n  <div class=\"nav-tab\">통합검색<\u002Fdiv>\n  <div class=\"nav-tab active\">AI 답변<\u002Fdiv>\n  <div class=\"nav-tab\">이미지<\u002Fdiv>\n  <div class=\"nav-tab\">뉴스<\u002Fdiv>\n<\u002Fnav>\n\n<div class=\"main-wrap\">\n  <div>\n    <div class=\"ai-panel\" id=\"aiPanel\">\n      <div class=\"ai-hd\">\n        <span class=\"ai-badge\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z\"><\u002Fpath><\u002Fsvg>AI 답변<\u002Fspan>\n        <span class=\"ai-hd-txt\">스마트 검색 AI가 검색 결과를 바탕으로 요약한 내용이에요<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ai-body\">\n        <p>문어는 지구에서 가장 똑똑한 동물 중 하나로 알려져 있어요.<\u002Fp>\n        <p>\n          <span class=\"hl\" id=\"hl-s1\" >문어는 원숭이만큼 똑똑하다는 실험 결과가 있다고 해요.<\u002Fspan>\n          <span class=\"hl\" id=\"hl-s2\" >문어의 뇌 세포는 강아지보다 훨씬 많다고 알려져 있어요.<button class=\"inline-src-tag b-news\" id=\"srctag-s2\" onclick=\"event.stopPropagation();openSrcTag('s2')\" title=\"뉴스 출처 보기\">뉴스↗<\u002Fbutton><\u002Fspan>\n          <span class=\"hl\" id=\"hl-s3\" >문어는 도구를 쓰고, 미로를 혼자 풀고, 저마다 다른 성격도 있다고 해요.<button class=\"inline-src-tag b-gov\" id=\"srctag-s3\" onclick=\"event.stopPropagation();openSrcTag('s3')\" title=\"국립기관 출처 보기\">국립기관↗<\u002Fbutton><\u002Fspan>\n          <span class=\"hl\" id=\"hl-s4\" >문어는 잠을 자면서 피부 색깔이 바뀌는데, 꿈을 꾸기 때문이라고 해요.<button class=\"inline-src-tag b-news\" id=\"srctag-s4\" onclick=\"event.stopPropagation();openSrcTag('s4')\" title=\"뉴스 출처 보기\">뉴스↗<\u002Fbutton><\u002Fspan>\n          <span class=\"hl\" id=\"hl-s5\" >문어는 팔이 8개인데, 각각의 팔이 스스로 움직임을 결정할 수 있다고 해요.<button class=\"inline-src-tag b-edu\" id=\"srctag-s5\" onclick=\"event.stopPropagation();openSrcTag('s5')\" title=\"학술자료 출처 보기\">학술자료↗<\u002Fbutton><\u002Fspan>\n        <\u002Fp>\n        <div class=\"src-dropdown\" id=\"srcDropdown\">\n          <div class=\"src-dropdown-hd\">\n            <span class=\"src-dropdown-tag\" id=\"srcDropdownTag\"><\u002Fspan>\n            <button class=\"src-dropdown-close\" onclick=\"closeSrcDropdown()\">닫기 ✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"src-dropdown-body\">\n            <div class=\"sc-quote\" id=\"srcDropdownQuote\"><\u002Fdiv>\n            <button class=\"src-confirm-btn\" id=\"srcConfirmBtn\" onclick=\"confirmSrc()\">✅ 출처 글 확인했어요 — 선택지 열기<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"src-badge-list\" id=\"srcBadgeList\" style=\"display:none;\">\n        <div class=\"src-badge-ttl\">🔗 검색 결과 출처<\u002Fdiv>\n        <div class=\"src-badge-row\">\n          <span class=\"src-bdg b-blog\">📝 블로그<\u002Fspan>\n          <span class=\"src-bdg b-news\">📰 뉴스<\u002Fspan>\n          <span class=\"src-bdg b-gov\">🏛️ 국립기관<\u002Fspan>\n          <span class=\"src-bdg b-news\">📰 뉴스<\u002Fspan>\n          <span class=\"src-bdg b-edu\">📚 학술자료<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <aside class=\"sidebar\">\n    <div class=\"side-card\" id=\"sideCard\" style=\"display:none;\">\n      <div class=\"side-hd\">🔗 검색 결과 출처<\u002Fdiv>\n      <div style=\"padding:13px 14px 14px;\">\n        <div class=\"src-badge-row\" style=\"flex-wrap:wrap;gap:8px;\">\n          <span class=\"src-bdg b-blog\">📝 블로그<\u002Fspan>\n          <span class=\"src-bdg b-news\">📰 뉴스<\u002Fspan>\n          <span class=\"src-bdg b-gov\">🏛️ 국립기관<\u002Fspan>\n          <span class=\"src-bdg b-news\">📰 뉴스<\u002Fspan>\n          <span class=\"src-bdg b-edu\">📚 학술자료<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted);margin-top:11px;line-height:1.6;\">각 문장 끝의 출처 태그를 눌러 내용을 확인해봐요<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n\n<div class=\"stat-popup\" id=\"statPopup\"><\u002Fdiv>\n\n<div class=\"act-wrap\" id=\"actWrap\">\n<div class=\"act-inner\">\n\n  <div id=\"st0\">\n    <div class=\"st-hd\"><span class=\"st-pill\">활동 1<\u002Fspan><span class=\"st-ttl\">읽고 나서 — 첫 느낌을 기록해봐요<\u002Fspan><div class=\"prog\" id=\"pg0\"><\u002Fdiv><\u002Fdiv>\n    <p class=\"st-desc\">위 AI 답변을 읽었나요? 아직 출처는 확인하지 않은 상태예요. 지금 얼마나 믿어지는지 점수와 이유를 적어봐요.<\u002Fp>\n    <p style=\"font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;\">📊 믿음 점수 (0 = 전혀 안 믿어짐 / 100 = 완전히 믿어짐)<\u002Fp>\n    <div class=\"sc-row\"><input type=\"range\" id=\"sc0\" min=\"0\" max=\"100\" value=\"70\" oninput=\"updSc('sc0','sb0')\"/><div class=\"sc-badge\" id=\"sb0\">70<\u002Fdiv><\u002Fdiv>\n    <div class=\"sc-lbl-row\"><span>0<\u002Fspan><span>100<\u002Fspan><\u002Fdiv>\n    <div class=\"think-box\" style=\"margin-top:9px;\">\n      <label for=\"ta0\">✏️ 이 점수를 준 이유는 무엇인가요?<\u002Flabel>\n      <textarea class=\"think-ta\" id=\"ta0\" rows=\"2\" maxlength=\"100\" placeholder=\"예: 내용이 신기해서 믿어진다 / 어디서 가져온 건지 모르겠다 등\" oninput=\"cc('ta0','c0')\"><\u002Ftextarea>\n      <div class=\"ch\"><span id=\"c0\">0<\u002Fspan>/100자<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn-p\" onclick=\"goHunt()\">각 문장의 출처를 살펴볼까요? →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"st1\" style=\"display:none;\">\n    <div class=\"st-hd\"><span class=\"st-pill\">활동 2<\u002Fspan><span class=\"st-ttl\" id=\"st1ttl\">문장 살펴보기<\u002Fspan><div class=\"prog\" id=\"pg1\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--blue-soft);border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;line-height:1.6;margin-bottom:10px;\" id=\"sentBox\"><\u002Fdiv>\n    <div class=\"src-reader-panel\" id=\"srcReaderPanel\">\n      <div class=\"src-reader-hd\">\n        <div class=\"src-reader-title\">📄 오른쪽 칸에서 출처 원문 읽기 <span id=\"srcReaderTag\"><\u002Fspan><\u002Fdiv>\n        <button class=\"src-reader-close\" onclick=\"closeSrcDropdown()\">닫기 ✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"src-reader-body\">\n        <div class=\"src-reader-guide\">AI 문장과 출처 원문이 같은 뜻인지 천천히 비교해봐요.<\u002Fdiv>\n        <div class=\"src-reader-quote\" id=\"srcReaderQuote\"><\u002Fdiv>\n        <button class=\"src-reader-btn\" id=\"srcReaderBtn\" onclick=\"confirmSrc()\">✅ 출처 글 확인했어요 — 선택지 열기<\u002Fbutton>\n        <div class=\"src-reader-note\" id=\"srcReaderNote\">✅ 출처 글을 확인했어요. 아래 선택지를 골라봐요.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"actArea\"><\u002Fdiv>\n    <div class=\"hint-box\" id=\"hintBox\">\n      <div class=\"hint-box-ttl\">💡 힌트<\u002Fdiv>\n      <div class=\"hint-box-txt\" id=\"hintTxt\"><\u002Fdiv>\n      <button class=\"retry-btn\" id=\"retryBtn\">다시 선택해볼게요 →<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"fb\" id=\"fb1\"><\u002Fdiv>\n    <div id=\"fixArea\" style=\"display:none;\"><\u002Fdiv>\n    <div class=\"btn-row\" id=\"nextRow\" style=\"display:none;\">\n      <button class=\"btn-p\" id=\"nextBtn\" onclick=\"nextSent()\">다음 문장 살펴보기 →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"st2\" style=\"display:none;\">\n    <div class=\"st-hd\"><span class=\"st-pill\">활동 3<\u002Fspan><span class=\"st-ttl\">출처를 확인하고 나니, 생각이 달라졌나요?<\u002Fspan><div class=\"prog\" id=\"pg2\"><\u002Fdiv><\u002Fdiv>\n    <p class=\"st-desc\">5개 문장의 출처를 모두 확인했어요. 처음 점수와 비교해서 다시 기록해봐요.<\u002Fp>\n    <p style=\"font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;\">📊 지금의 믿음 점수<\u002Fp>\n    <div class=\"sc-row\"><input type=\"range\" id=\"sc2\" min=\"0\" max=\"100\" value=\"70\" oninput=\"updSc('sc2','sb2')\"/><div class=\"sc-badge\" id=\"sb2\">70<\u002Fdiv><\u002Fdiv>\n    <div class=\"sc-lbl-row\"><span>0<\u002Fspan><span>100<\u002Fspan><\u002Fdiv>\n    <div class=\"think-box\" style=\"margin-top:9px;\">\n      <label>✏️ 처음 점수는 <strong id=\"echo0\" style=\"color:var(--brand)\"><\u002Fstrong>점이었어요. 달라졌다면 이유는 무엇인가요?<\u002Flabel>\n      <textarea class=\"think-ta\" id=\"ta2\" rows=\"2\" maxlength=\"120\" placeholder=\"예: 출처가 없는 문장이 있어서 / 표현이 과장된 것 같아서 등\" oninput=\"cc('ta2','c2')\"><\u002Ftextarea>\n      <div class=\"ch\"><span id=\"c2\">0<\u002Fspan>/120자<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn-p\" onclick=\"goVerdict()\">최종 판정하러 가기 →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"st3\" style=\"display:none;\">\n    <div class=\"st-hd\"><span class=\"st-pill\">활동 4<\u002Fspan><span class=\"st-ttl\">지금까지 결과를 보고 — 최종 판정을 내려봐요<\u002Fspan><div class=\"prog\" id=\"pg3\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"result-summary\">\n      <div class=\"rs-title\">📋 지금까지 확인한 결과<\u002Fdiv>\n      <div class=\"rs-sent-list\" id=\"rsSentList\"><\u002Fdiv>\n      <div class=\"rs-score-row\">\n        <div class=\"rs-score-box\"><div class=\"rsl\">처음 믿음 점수<\u002Fdiv><div class=\"rsv\" id=\"rsSc0\"><\u002Fdiv><div class=\"rsr\" id=\"rsR0\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"rs-score-box\"><div class=\"rsl\">확인 후 믿음 점수<\u002Fdiv><div class=\"rsv\" id=\"rsSc2\"><\u002Fdiv><div class=\"rsr\" id=\"rsR2\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-diff\" id=\"rsDiff\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"st-desc\">위 결과를 바탕으로, 이 AI 답변 전체를 어떻게 판정할지 골라봐요.<\u002Fp>\n    <div class=\"vgrid\">\n      <div class=\"vbtn vt\" data-v=\"trust\" onclick=\"selV(this)\"><div class=\"ve\">✅<\u002Fdiv><div class=\"vl\" style=\"color:var(--trust)\">신뢰<\u002Fdiv><div class=\"vdesc\">출처와 근거가 충분해서 믿어도 돼요<\u002Fdiv><\u002Fdiv>\n      <div class=\"vbtn vh\" data-v=\"hold\" onclick=\"selV(this)\"><div class=\"ve\">🤔<\u002Fdiv><div class=\"vl\" style=\"color:var(--hold)\">보류<\u002Fdiv><div class=\"vdesc\">일부는 맞지만, 확인 전까지 잠깐 미뤄요<\u002Fdiv><\u002Fdiv>\n      <div class=\"vbtn vd\" data-v=\"doubt\" onclick=\"selV(this)\"><div class=\"ve\">⚠️<\u002Fdiv><div class=\"vl\" style=\"color:var(--doubt)\">의심<\u002Fdiv><div class=\"vdesc\">출처나 근거가 부족하니 그대로 믿지 말아요<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"think-box\" style=\"margin-top:12px;\">\n      <label>💬 이번 활동에서 새롭게 알게 된 점이나 느낀 점을 자유롭게 적어봐요.<\u002Flabel>\n      <textarea class=\"think-ta\" id=\"taV\" rows=\"3\" maxlength=\"150\" placeholder=\"예: 출처가 없는 문장이 있다는 게 신기했다 / AI도 틀릴 수 있다는 걸 처음 알았다 등\" oninput=\"cc('taV','cV')\"><\u002Ftextarea>\n      <div class=\"ch\"><span id=\"cV\">0<\u002Fspan>/150자<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn-p\" onclick=\"goPromise()\">AI 정보를 읽는 나만의 약속 정하기 →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"st35\" style=\"display:none;\">\n    <div class=\"st-hd\"><span class=\"st-pill\">나의 약속<\u002Fspan><span class=\"st-ttl\">AI 정보를 읽는 나만의 약속<\u002Fspan><\u002Fdiv>\n    <p class=\"st-desc\">아래에서 나에게 해당하는 약속을 1개 이상 골라봐요. 직접 쓰고 싶은 말이 있으면 맨 아래에 써도 돼요.<\u002Fp>\n    <div class=\"promise-select\">\n      <div class=\"promise-select-ttl\">🤝 나의 AI 탐정 약속<div class=\"promise-select-sub\">1개 이상 골라봐요<\u002Fdiv><\u002Fdiv>\n      <div class=\"promise-items\">\n        <label class=\"promise-item\"><input type=\"checkbox\" value=\"AI 답변을 볼 때 출처 태그가 있는지 먼저 확인할게요.\"><span class=\"promise-lbl\">📌 AI 답변을 볼 때 출처 태그가 있는지 먼저 확인할게요.<\u002Fspan><\u002Flabel>\n        <label class=\"promise-item\"><input type=\"checkbox\" value=\"출처가 있어도 원문과 AI 문장을 직접 비교해볼게요.\"><span class=\"promise-lbl\">🔍 출처가 있어도 원문과 AI 문장을 직접 비교해볼게요.<\u002Fspan><\u002Flabel>\n        <label class=\"promise-item\"><input type=\"checkbox\" value=\"사실인지 해석(추측)인지 구분하며 읽을게요.\"><span class=\"promise-lbl\">🧐 사실인지 해석(추측)인지 구분하며 읽을게요.<\u002Fspan><\u002Flabel>\n        <label class=\"promise-item\"><input type=\"checkbox\" value=\"내용이 신기하고 재미있어도 바로 믿지 않을게요.\"><span class=\"promise-lbl\">⚡ 내용이 신기하고 재미있어도 바로 믿지 않을게요.<\u002Fspan><\u002Flabel>\n        <label class=\"promise-item\"><input type=\"checkbox\" value=\"AI 답변이 의심스러울 때 다른 출처에서 한 번 더 확인할게요.\"><span class=\"promise-lbl\">📚 AI 답변이 의심스러울 때 다른 출처에서 한 번 더 확인할게요.<\u002Fspan><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"promise-custom\">\n        <textarea id=\"promiseCustom\" rows=\"2\" placeholder=\"✏️ 직접 쓰고 싶은 약속이 있으면 여기에 써봐요\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"btn-row\" style=\"margin-top:14px;\"><button class=\"btn-p\" onclick=\"makeReport()\">탐정 보고서 만들기 →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"st4\" style=\"display:none;\">\n    <div class=\"st-hd\"><span class=\"st-pill\">활동 5<\u002Fspan><span class=\"st-ttl\">나의 AI 탐정 보고서<\u002Fspan><div class=\"prog\" id=\"pg4\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"rpt-wrap\" id=\"rptWrap\">\n      <div class=\"rpt-hd\"><h2>🔍 AI 브리핑 탐정 보고서<\u002Fh2><p>문어는 정말 똑똑할까? — 출처 확인 탐정 활동 결과<\u002Fp><\u002Fdiv>\n      <div class=\"rpt-bd\">\n        <div class=\"rpt-sec\"><div class=\"rpt-sec-ttl\">🏆 탐정 칭호<\u002Fdiv><div class=\"title-card\" id=\"rptTitle\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"rpt-sec\"><div class=\"rpt-sec-ttl\">📋 문장별 출처 확인 결과<\u002Fdiv><div id=\"rptSents\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"rpt-sec\" id=\"fixRptSec\" style=\"display:none;\"><div class=\"rpt-sec-ttl\">✏️ AI 문장 수리 결과<\u002Fdiv><div class=\"fix-rpt\" id=\"rptFix\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"rpt-sec\">\n          <div class=\"rpt-sec-ttl\">📊 믿음 점수 변화<\u002Fdiv>\n          <div class=\"sc-cmp\"><div class=\"sc-box\"><div class=\"sb-l\">처음 점수<\u002Fdiv><div class=\"sb-v\" id=\"rSc0\"><\u002Fdiv><div class=\"sb-r\" id=\"rR0\"><\u002Fdiv><\u002Fdiv><div class=\"sc-box\"><div class=\"sb-l\">확인 후 점수<\u002Fdiv><div class=\"sb-v\" id=\"rSc2\"><\u002Fdiv><div class=\"sb-r\" id=\"rR2\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"sc-diff\" id=\"rDiff\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rpt-sec\"><div class=\"rpt-sec-ttl\">⚖️ 최종 판정<\u002Fdiv><div class=\"vrpt\" id=\"rVerdict\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"hardest-box\"><div class=\"hb-ttl\">🤔 가장 판단하기 어려웠던 문장<\u002Fdiv><div class=\"hb-txt\" id=\"rHardest\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"promise-box\"><div class=\"pb-ttl\">🤝 AI 정보를 읽는 나의 약속<\u002Fdiv><div class=\"pb-txt\" id=\"rPromise\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"btn-row\" style=\"margin-top:11px;\">\n      <button class=\"btn-s\" onclick=\"resetApp()\">처음부터 다시하기<\u002Fbutton>\n      <button class=\"btn-p\" onclick=\"printReport()\">보고서 인쇄 🖨️<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"print-overlay\" id=\"printOverlay\">\n  <button class=\"print-close-btn\" onclick=\"closePrint()\">✕ 닫기<\u002Fbutton>\n  <div class=\"print-overlay-inner\" id=\"printContent\"><\u002Fdiv>\n  <div style=\"max-width:680px;margin:16px auto 0;display:flex;gap:10px;justify-content:flex-end;\" class=\"btn-row\">\n    <button class=\"btn-s\" onclick=\"closePrint()\">← 돌아가기<\u002Fbutton>\n    <button class=\"btn-p\" onclick=\"window.print()\">🖨️ 인쇄하기<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n`;\n  }\n\n  wireApp(){\nconst SENTS={\n  s1:{\n    num:'①', text:'문어는 원숭이만큼 똑똑하다는 실험 결과가 있다고 해요.',\n    question:'이 문장의 가장 큰 문제는 무엇일까요?',\n    choices:[\n      {id:'a',txt:'📭 출처가 없어요 — 어디서 온 정보인지 알 수 없어요',correct:true},\n      {id:'b',txt:'📅 너무 오래된 자료예요'},\n      {id:'c',txt:'📢 광고성 표현이 들어있어요'},\n      {id:'d',txt:'🌀 내용이 너무 신기해서 거짓말처럼 들려요'},\n    ],\n    hint:'AI 문장 뒤를 잘 봐요. 다른 문장들과 달리 이 문장에는 어떤 표시가 빠져 있나요?',\n    wrongFb:{\n      b:'오래된 자료인지는 날짜가 있어야 알 수 있어요. 그런데 이 문장에는 날짜 정보 자체가 없어요. 더 근본적인 문제가 뭔지 생각해봐요.',\n      c:'광고성 표현은 \"지금 사세요!\", \"최고!\", \"1등!\" 같은 말이에요. 이 문장에 그런 표현이 있나요?',\n      d:'내용이 신기하거나 놀랍다는 것만으로는 거짓이라고 할 수 없어요. 실제로 문어는 놀라운 능력을 가진 동물이에요. 신뢰 여부는 내용이 아니라 출처로 판단해요.',\n    },\n    srcCards:[\n      {tag:'블로그',tagCls:'b-blog',quote:'\"문어는 원숭이만큼 똑똑하다고 합니다. 실험에서도 비슷한 결과가 나왔다고 어디선가 읽은 것 같아요. 문어가 미로도 풀고 도구도 쓴다니 정말 신기하죠? 역시 바다 동물 중 가장 똑똑한 것 같아요.\" — 개인 블로그 (출처 링크 없음)'},\n      {tag:'뉴스',tagCls:'b-news',quote:'\"문어는 뛰어난 학습 능력과 문제 해결 능력을 가진 동물입니다. 그러나 문어와 원숭이의 지능을 직접 수치로 비교한 공인된 연구 결과는 현재까지 보고된 바 없습니다. 전문가들은 서로 다른 종의 지능을 단순 비교하는 것 자체가 과학적으로 어렵다고 말합니다.\" — 과학 뉴스 (2022)'},\n      {tag:'알 수 없음',tagCls:'',quote:'⚠️ 스마트 검색 AI의 이 답변에는 출처가 표시되어 있지 않습니다. 이 정보가 어느 연구나 자료를 근거로 한 것인지 확인할 방법이 없습니다. 출처가 없는 정보는 내용이 맞는지 틀린지 검증하기 어렵습니다.'},\n    ],\n    correctCard:2,\n    fbType:'doubt',\n    fbTitle:'⚠️ 이 문장은 출처를 알 수 없어요!',\n    fbBody:'AI가 이 내용을 어디서 가져왔는지 밝히지 않았어요. 실제로 문어와 원숭이의 지능을 직접 수치로 비교한 공인 연구도 현재까지 없어요.',\n    fbKey:'출처를 알 수 없는 정보는 그럴듯해 보여도 사실인지 확인할 방법이 없어요.',\n    verdict:'doubt',label:'출처 알 수 없음 → 의심',hasFix:false,\n  },\n  s2:{\n    num:'②', text:'문어의 뇌 세포는 강아지보다 훨씬 많다고 알려져 있어요.',\n    question:'AI 문장과 뉴스 원문을 비교했을 때, 달라진 부분은 무엇인가요?',\n    choices:[\n      {id:'a',txt:'📅 뉴스의 날짜를 다르게 바꿨어요'},\n      {id:'b',txt:'🔢 뉴스의 \"비슷한 수준\"을 \"훨씬 많다\"로 바꿨어요',correct:true},\n      {id:'c',txt:'🐾 비교 대상 동물을 고양이에서 강아지로 바꿨어요'},\n      {id:'d',txt:'📰 뉴스 기사의 제목을 바꿨어요'},\n    ],\n    hint:'원문에서 문어와 강아지의 뉴런 수를 어떻게 표현했나요? AI 문장과 그 표현을 나란히 놓고 비교해봐요.',\n    wrongFb:{\n      a:'날짜는 이 문장에서 핵심적으로 달라진 부분이 아니에요. 원문과 AI 문장에서 \"강아지\"를 표현한 방식을 비교해봐요.',\n      c:'원문에서도 강아지와 비교하고, AI 문장에서도 강아지와 비교해요. 비교 대상은 같아요. 표현 방식이 어떻게 달라졌는지 찾아봐요.',\n      d:'제목은 이 활동에서 확인하는 대상이 아니에요. 출처 내용과 AI 문장의 표현 차이에 집중해봐요.',\n    },\n    srcCards:[\n      {tag:'블로그',tagCls:'b-blog',quote:'\"문어는 강아지보다 훨씬 더 똑똑하다고 들었어요. 뇌세포도 훨씬 많다고 하더라고요. 사실인지 모르겠지만 그렇게 읽었어요. 문어가 이렇게 대단한 동물인지 몰랐네요.\" — 개인 블로그 (출처 없음)'},\n      {tag:'뉴스',tagCls:'b-news',quote:'\"문어의 뉴런(신경세포) 수는 약 5억 개로 알려져 있습니다. 강아지의 뉴런 수도 약 5억 개 수준으로 두 동물은 비슷한 수준입니다. 일부 자료에서 문어가 강아지보다 뇌세포가 많다고 표현하는 경우가 있으나, 현재 연구에 따르면 비슷한 수준으로 보는 것이 더 정확합니다.\" — 과학 뉴스 (2023)'},\n      {tag:'알 수 없음',tagCls:'',quote:'⚠️ 이 문장의 출처도 AI 답변에 표시되어 있지 않습니다. 또한 뉴스 기사는 \"비슷한 수준\"이라고 했는데 AI는 \"훨씬 많다\"고 표현했어요. 출처를 확인하니 AI가 표현 함께 적힌 출처라면 더 믿어도 괜찮아요. 기관 이름이 있는지, 연도가 적혀 있는지 꼭 확인해요!',\n    verdict:'trust',label:'공식 연구 기관 출처 → 신뢰',hasFix:false,\n  },\n  s4:{\n    num:'④', text:'문어는 잠을 자면서 피부 색깔이 바뀌는데, 꿈을 꾸기 때문이라고 해요.',\n    question:'이 문장에서 아직 확실하지 않은 \"해석(추측)\"은 어느 부분인가요?',\n    choices:[\n      {id:'a',txt:'🌊 문어가 잠을 잔다는 것'},\n      {id:'b',txt:'🎨 잠을 자면서 피부 색깔이 바뀐다는 것'},\n      {id:'c',txt:'💭 꿈을 꾸기 때문이라는 해석',correct:true},\n      {id:'d',txt:'🔬 피부 색깔 변화가 REM 수면과 관련 있다는 것'},\n    ],\n    hint:'원문을 다시 읽어봐요. 과학자들이 \"아직 확실하지 않다\" 또는 \"연구 중\"이라고 말하는 부분이 어디인가요?',\n    wrongFb:{\n      a:'문어가 수면을 취한다는 사실은 관찰을 통해 확인된 내용이에요. 원문 두 곳 모두 이 부분은 사실로 인정하고 있어요.',\n      b:'피부 색깔이 바뀐다는 것도 영상으로 직접 관찰된 사실이에요. 원문이 사실로 인정하는 내용이에요.',\n      d:'REM 수면과의 관련성도 불확실한 내용이에요. 하지만 AI 문장에서 직접 단정한 표현은 어느 부분인지 다시 찾아봐요. \"꿈을 꾸기 때문\"이라는 표현을 원문에서 찾을 수 있나요?',\n    },\n    srcCards:[\n      {tag:'뉴스',tagCls:'b-news',quote:'\"연구팀은 문어가 수면 중 피부 색깔과 무늬가 빠르게 변하는 것을 영상으로 포착했습니다. 이 현상이 사람의 REM 수면(꿈을 꾸는 수면 단계)과 비슷할 수 있다고 일부 연구자들이 추측했습니다. 그러나 문어가 실제로 꿈을 꾸는지는 아직 과학적으로 확인되지 않았습니다.\" — 과학 뉴스 (2019)'},\n      {tag:'학술자료',tagCls:'b-edu',quote:'\"문어가 수면 중 피부색이 변화하는 현상은 관찰을 통해 확인된 사실입니다. 이 현상이 REM 수면과 유사한지에 대해서는 연구자들 사이에 의견이 갈립니다. 문어가 꿈을 꾼다는 주장은 현재 과학적으로 증명되지 않은 해석이며, 연구가 진행 중입니다.\" — 동물행동학 학술지 (2021)'},\n      {tag:'블로그',tagCls:'b-blog',quote:'\"문어가 꿈을 꾼다는 게 밝혀졌대요! 자면서 피부 색깔이 바뀌는 영상도 있어요. 꿈에서 뭔가를 보는 것 같다는 얘기도 있던데, 문어가 어떤 꿈을 꿀지 정말 궁금해요.\" — 개인 블로그 (출처 없음)'},\n    ],\n    correctCard:0,\n    fbType:'hold',\n    fbTitle:'🤔 사실과 해석을 구분해야 해요!',\n    fbBody:'피부 색깔이 바뀐다는 건 영상으로 관찰된 사실이에요. 하지만 \"꿈을 꾸기 때문\"이라는 건 과학자들이 아직 논쟁 중인 해석이에요. AI가 마치 확실한 것처럼 표현했어요.',\n    fbKey:'\"사실\"과 \"해석(추측)\"은 달라요. AI가 단정 지어 말해도 아직 논쟁 중인 내용일 수 있어요.',\n    verdict:'hold',label:'사실+미확정 해석 혼재 → 보류',hasFix:false,\n  },\n  s5:{\n    num:'⑤', text:'문어는 팔이 8개인데, 각각의 팔이 스스로 움직임을 결정할 수 있다고 해요.',\n    question:'AI 문장과 학술자료 원문을 비교했을 때, AI가 표현을 바꾼 부분은 어디인가요?',\n    choices:[\n      {id:'a',txt:'📅 자료가 발표된 날짜를 바꿨어요'},\n      {id:'b',txt:'🐙 팔의 개수를 다르게 표현했어요'},\n      {id:'c',txt:'🧠 \"조절한다\ eturn;\n  STAT.care[id]=true;\n  renderCareBadges(id);\n  updateStatBar();\n  showStatChip(`${BADGES[id].emoji} 신중력 배지: ${BADGES[id].name}`);\n}\n\nfunction renderCareBadges(animId){\n  const wrap=qs('#careBadges');\n  if(!wrap) return;\n  wrap.innerHTML='';\n  Object.keys(BADGES).forEach(id=>{\n    const b=BADGES[id];\n    const earned=STAT.care&&STAT.care[id];\n    const el=document.createElement('div');\n    el.className='care-badge'+(earned?' earned':'')+(animId===id?' pop':'');\n    el.textContent=b.emoji;\n    el.title=`${b.name} — ${b.desc}`;\n    wrap.appendChild(el);\n  });\n}\n\nfunction gainStat(det,msg){\n  STAT.det=Math.min(DET_MAX,STAT.det+det);\n  updateStatBar();\n  if(msg) showStatChip(msg);\n}\nfunction updateStatBar(){\n  qs('#detFill').style.width=STAT.det+'%';\n  qs('#detVal').textContent=STAT.det;\n  const done=Object.keys(S.answers).filter(k=>S.answers[k]).length;\n  qs('#statProg').textContent=`${done}/5 문장`;\n  const cc=qs('#careCount');if(cc)cc.textContent=`${careCount()}/5`;\n  renderCareBadges();\n}\nfunction showStatChip(msg){\n  const popup=qs('#statPopup');\n  const chip=document.createElement('div');\n  chip.className='stat-chip';chip.textContent=msg;\n  popup.appendChild(chip);\n  requestAnimationFrame(()=>{chip.classList.add('show');});\n  setTimeout(()=>{chip.classList.remove('show');setTimeout(()=>chip.remove(),350);},2000);\n}\n\nfunction getTitle(){\n  const d=STAT.det, c=careCount();\n  if(d>=80 && c>=4) return {emoji:'🏅',name:'명탐정',desc:'정확하게 판단하고, 출처도 끝까지 꼼꼼히 확인했어요. 최고의 AI 탐정이에요!'};\n  if(d>=80 && c<4)  return {emoji:'🔍',name:'정확한 탐정',desc:'판단이 정확해요! 출처를 한 번 더 비교하고 신중하게 확인하면 명탐정이 될 거예요.'};\n  if(d<80 && c>=4)  return {emoji:'🧭',name:'신중한 탐정',desc:'몇 개는 헷갈렸지만 출처를 끝까지 확인하는 태도가 훌륭해요. 그게 진짜 탐정의 힘이에요!'};\n  if(d>=40)         return {emoji:'🕵️',name:'성장하는 탐정',desc:'잘 하고 있어요! 출처 카드를 천천히 비교하면 탐정력도 신중력도 함께 올라가요.'};\n  return {emoji:'🌱',name:'탐정 견습생',desc:'출처 확인이 처음이라 어려웠죠? 다음엔 출처 글을 먼저 열어 천천히 비교해봐요!'};\n}\n\nlet S={sc0:70,sc2:70,reason0:'',reason2:'',reasonV:'',curIdx:0,\n  answers:{},\n  choiceTxt:{},\n  firstWrongTxt:{},\n  srcConfirmed:{},\n  sentVerdicts:{},\n  verdictRetried:{},\n  promises:[],\n  retried:{},fixText:'',verdict:null};\n\nfunction qs(s){return document.querySelector(s);}\nfunction toast(m){const t=qs('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}\nfunction cc(tid,cid){qs('#'+cid).textContent=qs('#'+tid).value.length;}\nfunction updSc(sid,bid){const v=Number(qs('#'+sid).value);qs('#'+bid).textContent=v;if(sid==='sc0')S.sc0=v;else S.sc2=v;}\nfunction dots(active,elId){const el=qs('#'+elId);if(!el)return;el.innerHTML='';for(let i=0;i<TOTAL;i++){const d=document.createElement('span');d.className='dot '+(i<active?'done':i===active?'on':'');el.appendChild(d);}}\nfunction showSt(n){\n  S.stage=n;\n  for(let i=0;i<TOTAL;i++){\n    const el=qs('#st'+i);\n    if(el){\n      el.style.display=(i===n?'block':'none');\n      if(i===n){el.style.animation='none';void el.offsetWidth;el.style.animation='stageIn .45s ease both';}\n    }\n  }\n  const st35=qs('#st35');\n  if(st35)st35.style.display='none';\n  for(let i=0;i<TOTAL;i++)dots(n,'pg'+i);\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction startApp(){qs('#coverWrap').style.display='none';}\n\nfunction goHunt(){\n  const r=qs('#ta0').value.trim();\n  if(!r){toast('이유를 조금만 써봐요!');return;}\n  S.reason0=r;\n  S.sc0=Number(qs('#sc0').value);\n  qs('#aiPanel').classList.add('hunt');\n  const bl=qs('#srcBadgeList');if(bl)bl.style.display='block';\n  const sc=qs('#sideCard');if(sc)sc.style.display='block';\n  qs('#statBar').classList.add('show');\n  updateStatBar();\n  showSt(1);renderSent(0);\n}\n\nlet srcOpenSid=null;\n\nfunction openSrcTag(sid){\n  if(!qs('#aiPanel').classList.contains('hunt'))return;\n  if(sid!==ORDER[S.curIdx]){\n    toast(`지금은 ${SENTS[ORDER[S.curIdx]].num} 문장 차례예요 — 그 문장의 출처 태그를 눌러봐요!`);\n    return;\n  }\n  const s=SENTS[sid];\n  const card=s.srcCards[s.correctCard];\n  const reader=qs('#srcReaderPanel');\n  if(srcOpenSid===sid&&reader&&reader.classList.contains('open')){closeSrcDropdown();return;}\n  srcOpenSid=sid;\n\n  const dd=qs('#srcDropdown');\n  if(dd)dd.classList.remove('open');\n\n  qs('#srcReaderTag').innerHTML=`<span class=\"src-bdg ${card.tagCls}\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:4px;\">${card.tag}<\u002Fspan>`;\n  qs('#srcReaderQuote').textContent=card.quote;\n  const confirmed=S.srcConfirmed[sid];\n  const btn=qs('#srcReaderBtn');\n  btn.disabled=confirmed;\n  btn.textContent=confirmed?'✅ 이미 확인했어요':'✅ 출처 글 확인했어요 — 선택지 열기';\n  qs('#srcReaderNote').classList.toggle('show',!!confirmed);\n  reader.classList.add('open');\n  setTimeout(()=>reader.scrollIntoView({behavior:'smooth',block:'start'}),60);\n}\n\nfunction closeSrcDropdown(){\n  const dd=qs('#srcDropdown');\n  if(dd)dd.classList.remove('open');\n  const reader=qs('#srcReaderPanel');\n  if(reader)reader.classList.remove('open');\n  const note=qs('#srcReaderNote');\n  if(note)note.classList.remove('show');\n  srcOpenSid=null;\n}\n\nfunction confirmSrc(){\n  if(!srcOpenSid)return;\n  const sid=srcOpenSid;\n  S.srcConfirmed[sid]=true;\n  if(['s2','s3','s4','s5'].every(id=>S.srcConfirmed[id])) earnBadge('src');\n  const tag=qs('#srctag-'+sid);\n  if(tag)tag.classList.add('read');\n  const btn=qs('#srcReaderBtn');\n  if(btn){btn.disabled=true;btn.textContent='✅ 이미 확인했어요';}\n  const oldBtn=qs('#srcConfirmBtn');\n  if(oldBtn){oldBtn.disabled=true;oldBtn.textContent='✅ 이미 확인했어요';}\n  const note=qs('#srcReaderNote');\n  if(note)note.classList.add('show');\n  if(ORDER[S.curIdx]===sid)showSrcAndUnlock(sid);\n}\n\nfunction showSrcAndUnlock(sid){\n  const s=SENTS[sid];\n  const card=s.srcCards[s.correctCard];\n  const guideEl=qs('#guideBox'+sid);\n  if(guideEl){\n    guideEl.style.cssText='background:#f0fdf4;border:1.5px solid #6ee7b7;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;';\n    guideEl.innerHTML=`\n      <div style=\"font-size:13px;font-weight:900;color:var(--trust);margin-bottom:4px;\">✅ 출처 글 확인 완료<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--ink-soft);line-height:1.6;\">\n        오른쪽 칸의 <span class=\"src-bdg ${card.tagCls}\" style=\"font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin:0 2px;\">${card.tag}<\u002Fspan> 출처 원문과 AI 문장을 비교하면서 아래 선택지를 골라봐요.\n      <\u002Fdiv>`;\n  }\n  const lockEl=qs('#choiceLock'+sid);\n  const gridEl=qs('#choiceGrid'+sid);\n  if(lockEl)lockEl.style.display='none';\n  if(gridEl){gridEl.style.display='grid';setTimeout(()=>gridEl.scrollIntoView({behavior:'smooth',block:'nearest'}),80);}\n}\n\nfunction renderSent(idx){\n  const sid=ORDER[idx];\n  const s=SENTS[sid];\n  S.curIdx=idx;\n\n  ORDER.forEach((id,i)=>{\n    const el=qs('#hl-'+id);if(!el)return;\n    el.classList.toggle('active',i===idx);\n    el.classList.toggle('done',!!S.answers[id]);\n  });\n  qs('#st1ttl').textContent=`${s.num} 문장 살펴보기 (${idx+1}/${ORDER.length})`;\n  qs('#sentBox').innerHTML=`AI 문장: <strong>\"${s.text}\"<\u002Fstrong>`;\n\n  const area=qs('#actArea');area.innerHTML='';\n  qs('#fb1').className='fb';qs('#fb1').innerHTML='';\n  qs('#hintBox').className='hint-box';\n  qs('#fixArea').style.display='none';qs('#fixArea').innerHTML='';\n  qs('#nextRow').style.display='none';\n  document.querySelectorAll('.verdict-pick').forEach(el=>el.remove());\n  closeSrcDropdown();\n\n  if(sid==='s1'){\n    area.innerHTML=`\n      <div style=\"background:#fee2e2;border:2px solid #fca5a5;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;\">\n        <div style=\"font-size:15px;font-weight:900;color:#991b1b;margin-bottom:6px;\">⚠️ 이 문장에는 출처 태그가 없어요!<\u002Fdiv>\n        <div style=\"font-size:13px;color:#7f1d1d;line-height:1.7;\">\n          다른 문장들에는 <strong>[뉴스↗]<\u002Fstrong> <strong>[국립기관↗]<\u002Fstrong> 같은 출처 태그가 붙어 있어요.<br>\n          이 문장에는 그런 태그가 없어요. AI가 이 내용을 어디서 가져왔는지 밝히지 않은 거예요.<br>\n          출처가 없으면 정보가 사실인지 확인할 방법이 없어요.\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:7px;\">🤔 ${s.question}<\u002Fdiv>\n      <div class=\"choice-grid\" id=\"choiceGrid${sid}\"><\u002Fdiv>`;\n    s.choices.forEach(ch=>{\n      const b=document.createElement('button');b.className='choice-btn';b.dataset.cid=ch.id;\n      b.textContent=ch.txt;b.onclick=()=>chooseAct(sid,ch,b,qs('#choiceGrid'+sid),s,false);\n      qs('#choiceGrid'+sid).appendChild(b);\n    });\n    setTimeout(()=>qs('#hl-'+sid).scrollIntoView({behavior:'smooth',block:'center'}),80);\n    return;\n  }\n\n  const card=s.srcCards[s.correctCard];\n  const guideBox=document.createElement('div');\n  guideBox.id='guideBox'+sid;\n  guideBox.style.cssText='background:var(--blue-soft);border:1.5px solid var(--blue-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;';\n  guideBox.innerHTML=`\n    <div style=\"font-size:13px;font-weight:900;color:var(--brand);margin-bottom:8px;\">📌 출처 글을 먼저 읽어봐요!<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);\">\n        <span style=\"background:var(--brand);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;flex-shrink:0;\">1단계<\u002Fspan>\n        위 AI 문장 끝의 <span class=\"src-bdg ${card.tagCls}\" style=\"font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin:0 2px;\">${card.tag}↗<\u002Fspan> 태그를 클릭해요\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);\">\n        <span style=\"background:var(--muted);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;flex-shrink:0;\">2단계<\u002Fspan>\n        출처 글을 읽고 <strong>✅ 출처 글 확인했어요<\u002Fstrong> 버튼을 눌러요\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);\">\n        <span style=\"background:var(--muted);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;flex-shrink:0;\">3단계<\u002Fspan>\n        선택지가 열리면 AI 문장과 비교해서 골라봐요\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  area.appendChild(guideBox);\n\n  const qBox=document.createElement('div');qBox.style.marginTop='4px';\n  qBox.innerHTML=`<div style=\"font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:7px;\">🤔 ${s.question}<\u002Fdiv>`;\n  const lockEl=document.createElement('div');lockEl.className='choice-locked';lockEl.id='choiceLock'+sid;\n  lockEl.innerHTML='<span>🔒<\u002Fspan>출처 글을 확인하면 선택지가 열려요';\n  const cg=document.createElement('div');cg.className='choice-grid';cg.id='choiceGrid'+sid;cg.style.display='none';\n  s.choices.forEach(ch=>{\n    const b=document.createElement('button');b.className='choice-btn';b.dataset.cid=ch.id;\n    b.textContent=ch.txt;b.onclick=()=>chooseAct(sid,ch,b,cg,s,false);cg.appendChild(b);\n  });\n  qBox.appendChild(lockEl);qBox.appendChild(cg);area.appendChild(qBox);\n  if(S.srcConfirmed[sid])showSrcAndUnlock(sid);\n  setTimeout(()=>qs('#hl-'+sid).scrollIntoView({behavior:'smooth',block:'center'}),80);\n}\n\nfunction chooseAct(sid,ch,btn,grid,s,isRetry){\n  if(S.answers[sid]&&!isRetry)return;\n  grid.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;b.classList.remove('sel','correct','wrong');});\n  btn.classList.add(ch.correct?'correct':'wrong');\n  S.choiceTxt[sid]=ch.txt;\n  if(!isRetry&&!ch.correct)S.firstWrongTxt[sid]=ch.txt;\n  if(ch.correct){\n    S.answers[sid]=ch.id;\n    gainStat(DET_PER,'🔍 +'+DET_PER+' 정확한 판단!');\n    if(isRetry) earnBadge('retry');\n    showFb(sid,s);\n  } else if(!isRetry){\n    S.retried[sid]=true;\n    const wfb=s.wrongFb&&s.wrongFb[ch.id]?s.wrongFb[ch.id]:'출처 글을 다시 꼼꼼히 읽어봐요.';\n    qs('#hintTxt').innerHTML=`<span style=\"color:#9a3412\">${wfb}<\u002Fspan><br><br><span style=\"color:#78350f\">💡 ${s.hint}<\u002Fspan>`;\n    qs('#hintBox').className='hint-box show';\n    qs('#retryBtn').onclick=()=>retryChoice(sid);\n    qs('#fixArea').style.display='none';qs('#fixArea').innerHTML='';\n  } else {\n    S.answers[sid]='wrong';\n    grid.querySelectorAll('.choice-btn').forEach(b=>{\n      if(s.choices.find(x=>x.id===b.dataset.cid&&x.correct))b.classList.add('correct');\n    });\n    qs('#hintBox').className='hint-box';\n    showFb(sid,s);\n  }\n}\n\nfunction retryChoice(sid){\n  const s=SENTS[sid];const grid=qs('#choiceGrid'+sid);\n  grid.querySelectorAll('.choice-btn').forEach(b=>{\n    b.disabled=false;b.classList.remove('correct','wrong');\n    const ch=s.choices.find(x=>x.id===b.dataset.cid);\n    b.onclick=()=>chooseAct(sid,ch,b,grid,s,true);\n  });\n  qs('#hintBox').className='hint-box';\n  qs('#fixArea').style.display='none';qs('#fixArea').innerHTML='';\n}\n\nfunction showFb(sid,s){\n  const fb=qs('#fb1');fb.className='fb show '+s.fbType;\n  fb.innerHTML=`<div class=\"fbt\">${s.fbTitle}<\u002Fdiv>${s.fbBody}<div class=\"fbk\">💡 핵심: ${s.fbKey}<\u002Fdiv>`;\n  if(s.hasFix){\n    qs('#fixArea').style.display='block';\n    qs('#fixArea').innerHTML=`<div class=\"fix-box\"><div class=\"fix-box-ttl\">✏️ AI 문장 수리하기<\u002Fdiv><div class=\"fix-original\">원래 AI 문장: \"${s.fixOriginal}\"<\u002Fdiv><p style=\"font-size:12px;color:#92400e;margin-bottom:6px;\">${s.fixHint}<\u002Fp><textarea class=\"fix-ta\" id=\"fixTa\" rows=\"2\" maxlength=\"100\" placeholder=\"더 정확한 표현으로 고쳐봐요...\"><\u002Ftextarea><\u002Fdiv>`;\n  }\n  const vpWrap=document.createElement('div');vpWrap.className='verdict-pick';vpWrap.id='vp-'+sid;\n  const vpLabels={trust:{e:'✅',l:'신뢰'},hold:{e:'🤔',l:'보류'},doubt:{e:'⚠️',l:'의심'}};\n  vpWrap.innerHTML=`\n    <div class=\"verdict-pick-ttl\">⚖️ 이 문장, 어떻게 판정할까요?<\u002Fdiv>\n    <div class=\"verdict-pick-btns\">\n      ${['trust','hold','doubt'].map(v=>`<button class=\"vp-btn ${v} active\" onclick=\"pickVerdict('${sid}','${v}',this)\">${vpLabels[v].e} ${vpLabels[v].l}<\u002Fbutton>`).join('')}\n    <\u002Fdiv>\n    <div class=\"verdict-pick-fb\" id=\"vpfb-${sid}\"><\u002Fdiv>`;\n  fb.after(vpWrap);\n  qs('#nextRow').style.display='none';\n}\n\nfunction pickVerdict(sid,v,btn){\n  S.sentVerdicts[sid]=v;\n  if(S.sentVerdicts.s4==='hold' && S.sentVerdicts.s5==='hold') earnBadge('hold');\n  const wrap=qs('#vp-'+sid);\n  wrap.querySelectorAll('.vp-btn').forEach(b=>{b.classList.remove('picked');b.style.pointerEvents='none';});\n  btn.classList.add('picked');\n\n  const FD={\n    s1:{doubt:{t:'맞아요! 출처가 아예 없으면 사실인지 확인할 방법이 없으니, 그대로 믿지 말고 의심하는 게 좋아요.',c:'ok'},\n        hold:{t:'출처가 아예 없을 때는 내용이 맞는지 확인할 방법 자체가 없어요. 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'출처가 아예 없을 땐 잠깐 미뤄 두는 정도가 아니라, 그대로 믿지 말고 의심해 봐야 해요. 어디서 온 정보인지 모르면 사실인지 확인할 방법이 없거든요.',rc:'wrong'},\n        trust:{t:'어디서 온 정보인지 알 수 없을 때 그냥 믿는 건 위험할 수 있어요. 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'출처가 아예 없을 땐 그대로 믿지 말고 의심해 봐야 해요. 내용이 맞는지 확인할 방법 자체가 없으니까요.',rc:'wrong'}},\n    s2:{doubt:{t:'출처 글과 AI 문장이 다르다는 걸 잘 찾아냈어요!',c:'ok'},\n        hold:{t:'출처 글과 AI 문장을 다시 비교해봐요. 달라진 부분이 보이나요? 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'AI가 뉴스의 \"비슷한 수준\"을 \"훨씬 많다\"로 바꿔 놨어요. 이렇게 내용이 달라졌을 땐 그대로 믿지 말고 의심해 봐야 해요.',rc:'wrong'},\n        trust:{t:'출처 글에서 뭐라고 했는지 다시 읽어봐요. AI 문장과 다른 부분이 있나요? 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'AI가 뉴스의 \"비슷한 수준\"을 \"훨씬 많다\"로 바꿔 놨어요. 내용이 이렇게 달라졌을 땐 곧이곧대로 믿지 말고 의심해 봐야 해요.',rc:'wrong'}},\n    s3:{trust:{t:'출처가 분명하고 실험으로 확인된 내용이라 믿어도 돼요. 잘 판단했어요!',c:'ok'},\n        hold:{t:'출처 글에서 이 내용이 어떻게 확인됐는지 다시 읽어봐요. 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'국립기관이 직접 실험으로 확인한 내용이라, 이건 믿어도 돼요.',rc:'wrong'},\n        doubt:{t:'국립기관에서 직접 실험으로 확인한 내용이에요. 출처 글을 다시 읽어볼까요? 🤔',c:'wrong',r:true,rt:'믿을 만한 기관이 실험으로 직접 확인한 내용이라, 이건 믿어도 괜찮아요.',rc:'wrong'}},\n    s4:{hold:{t:'피부 색이 바뀐다는 건 관찰된 사실이고, 꿈을 꾼다는 건 아직 논쟁 중이에요. 잘 구분했어요!',c:'ok'},\n        doubt:{t:'피부 색이 바뀐다는 건 영상으로 확인된 사실이에요. 확실하지 않은 건 어느 부분인지 다시 찾아볼까요? 🤔',c:'alt',r:true,rt:'사실인 부분도 있고 아직 확실하지 않은 부분도 섞여 있어요. 이럴 땐 그대로 믿지도, 무작정 의심하지도 말고 정확히 밝혀질 때까지 판단을 잠깐 미뤄 둬요.',rc:'alt'},\n        trust:{t:'출처 글에서 과학자들이 아직 확실하지 않다고 한 부분이 있어요. 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'\"꿈을 꾼다\"는 부분은 아직 과학적으로 밝혀지지 않았어요. 이럴 땐 다 믿지 말고, 확실해질 때까지 판단을 잠깐 미뤄 둬요.',rc:'wrong'}},\n    s5:{hold:{t:'\"조절한다\"와 \"결정한다\"는 달라요. 표현의 차이를 잘 발견했어요!',c:'ok'},\n        doubt:{t:'출처 글과 AI 문장에서 달라진 표현이 뭔지 다시 찾아봐요. 다시 한번 생각해볼까요? 🤔',c:'alt',r:true,rt:'출처는 있는데 표현만 살짝 부풀려졌어요. 이럴 땐 곧바로 믿지 말고, 정확한 표현인지 확인하기 전까지 판단을 잠깐 미뤄 둬요.',rc:'alt'},\n        trust:{t:'\"조절한다\"와 \"결정한다\"는 어떻게 다를까요? 다시 한번 생각해볼까요? 🤔',c:'wrong',r:true,rt:'\"결정한다\"는 표현이 부풀려졌어요. 출처와 표현이 다를 땐 다 믿기보다, 확인하기 전까지 판단을 잠깐 미뤄 두는 게 좋아요.',rc:'wrong'}},\n  };\n\n  const fb=FD[sid]?.[v]||{t:'판단했어요!',c:'ok'};\n  const fbEl=qs('#vpfb-'+sid);\n  const isRetry=!!(S.verdictRetried&&S.verdictRetried[sid]);\n\n  if(isRetry){\n    fbEl.className=`verdict-pick-fb show ${fb.rc||fb.c}`;\n    fbEl.innerHTML=`<div>${fb.rt||fb.t}<\u002Fdiv>`;\n  } else if(fb.r){\n    fbEl.className=`verdict-pick-fb show ${fb.c}`;\n    fbEl.innerHTML=`<div style=\"margin-bottom:8px;\">${fb.t}<\u002Fdiv>\n      <button onclick=\"repickVerdict('${sid}')\" style=\"font-size:11px;font-weight:800;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--brand);\">한 번 더 생각해볼게요 →<\u002Fbutton>`;\n  } else {\n    fbEl.className=`verdict-pick-fb show ${fb.c}`;\n    fbEl.innerHTML=`<div>${fb.t}<\u002Fdiv>`;\n  }\n\n  qs('#nextRow').style.display='flex';\n  const isLast=(S.curIdx===ORDER.length-1);\n  qs('#nextBtn').textContent=isLast?'출처 확인 완료 — 점수 다시 매기기 →':'다음 문장 살펴보기 →';\n  if(isLast)qs('#nextBtn').style.background='var(--trust)';\n}\n\nfunction repickVerdict(sid){\n  if(!S.verdictRetried)S.verdictRetried={};\n  S.verdictRetried[sid]=true;\n  delete S.sentVerdicts[sid];\n  qs('#vp-'+sid).querySelectorAll('.vp-btn').forEach(b=>{b.classList.remove('picked');b.style.pointerEvents='auto';});\n  const fbEl=qs('#vpfb-'+sid);fbEl.className='verdict-pick-fb';fbEl.innerHTML='';\n  qs('#nextRow').style.display='none';\n}\n\nfunction nextSent(){\n  const sid=ORDER[S.curIdx];\n  if(!S.sentVerdicts[sid]){toast('이 문장을 신뢰 / 보류 / 의심 중 하나로 판정해봐요!');return;}\n  const ta=qs('#fixTa');if(ta){S.fixText=ta.value.trim();if(S.fixText) earnBadge('fix');}\n  if(S.curIdx<ORDER.length-1){\n    renderSent(S.curIdx+1);\n  } else {\n    qs('#sc2').value=S.sc0;qs('#sb2').textContent=S.sc0;S.sc2=S.sc0;qs('#echo0').textContent=S.sc0;\n    showSt(2);\n  }\n}\n\nfunction goVerdict(){\n  const r=qs('#ta2').value.trim();\n  if(!r){toast('달라진 이유를 써봐요!');return;}\n  S.reason2=r;S.sc2=Number(qs('#sc2').value);\n  buildResultSummary();showSt(3);\n}\n\nfunction buildResultSummary(){\n  const lmap={trust:'✅ 신뢰',hold:'🤔 보류',doubt:'⚠️ 의심'};\n  const list=qs('#rsSentList');list.innerHTML='';\n  ORDER.forEach(sid=>{\n    const s=SENTS[sid];const d=document.createElement('div');\n    const myV=S.sentVerdicts[sid];\n    const myVlbl=myV?lmap[myV]:'(미선택)';\n    d.className='rs-sent '+(myV||s.verdict);\n    d.innerHTML=`<div class=\"rs-sent-lbl\">${s.num} 내 판정: ${myVlbl}<\u002Fdiv>${s.text}`;\n    list.appendChild(d);\n  });\n  qs('#rsSc0').textContent=S.sc0;qs('#rsR0').textContent=S.reason0;\n  qs('#rsSc2').textContent=S.sc2;qs('#rsR2').textContent=S.reason2;\n  const diff=S.sc2-S.sc0;const de=qs('#rsDiff');\n  if(diff>5){de.className='rs-diff up';de.textContent=`처음보다 ${diff}점 올라갔어요`;}\n  else if(diff<-5){de.className='rs-diff dn';de.textContent=`처음보다 ${Math.abs(diff)}점 내려갔어요`;}\n  else{de.className='rs-diff same';de.textContent='처음 점수와 비슷해요';}\n}\n\nfunction selV(el){el.parentElement.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');S.verdict=el.dataset.v;}\n\nfunction goPromise(){\n  if(!S.verdict){toast('판정을 골라주세요!');return;}\n  const r=qs('#taV').value.trim();if(!r){toast('소감도 써봐요!');return;}\n  S.reasonV=r;\n  qs('#st3').style.display='none';\n  S.stage=35;\n  const st35=qs('#st35');\n  st35.style.display='block';\n  st35.style.animation='none';void st35.offsetWidth;st35.style.animation='stageIn .45s ease both';\n  setTimeout(()=>st35.scrollIntoView({behavior:'smooth',block:'start'}),80);\n}\n\nfunction makeReport(){\n  const checked=[...document.querySelectorAll('.promise-select input[type=checkbox]:checked')].map(c=>c.value);\n  const custom=qs('#promiseCustom')?.value.trim();\n  if(custom)checked.push(custom);\n  if(checked.length===0){toast('약속을 1개 이상 골라봐요!');return;}\n  S.promises=checked;\n  buildReport();showSt(4);\n  setTimeout(()=>qs('#st4').scrollIntoView({behavior:'smooth',block:'start'}),100);\n}\n\nfunction buildReport(){\n  earnBadge('finish');\n  const t=getTitle();\n  qs('#rptTitle').innerHTML=`\n    <div class=\"title-emoji\">${t.emoji}<\u002Fdiv>\n    <div class=\"title-name\">${t.name}<\u002Fdiv>\n    <div class=\"title-desc\">${t.desc}<\u002Fdiv>\n    <div class=\"title-stats\">\n      <div class=\"title-stat\"><div class=\"title-stat-lbl\">🔍 탐정력<\u002Fdiv><div class=\"title-stat-val\">${STAT.det}<\u002Fdiv><\u002Fdiv>\n      <div class=\"title-stat\"><div class=\"title-stat-lbl\">🎖️ 신중력<\u002Fdiv><div class=\"title-stat-val\">${careCount()}/5<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"title-badges\" id=\"titleBadges\"><\u002Fdiv>`;\n  const tb=qs('#titleBadges');\n  if(tb){\n    Object.keys(BADGES).forEach(id=>{\n      const b=BADGES[id];const e=STAT.care&&STAT.care[id];\n      const sp=document.createElement('span');\n      sp.className='title-badge'+(e?'':' locked');\n      sp.textContent=`${b.emoji} ${b.name}`;\n      tb.appendChild(sp);\n    });\n  }\n\n  const lmap={trust:'✅ 신뢰',hold:'🤔 보류',doubt:'⚠️ 의심'};\n  const sg=qs('#rptSents');sg.innerHTML='';\n  ORDER.forEach(sid=>{\n    const s=SENTS[sid];\n    const isCorrect=S.answers[sid]&&S.answers[sid]!=='wrong';\n    const myTxt=S.choiceTxt[sid]||'(선택 없음)';\n    const correctTxt=s.choices.find(c=>c.correct)?.txt||'';\n    const resultMark=isCorrect?'✅':'❌';\n    const wasRetried=S.retried[sid];\n    const firstWrong=S.firstWrongTxt[sid];\n    const myV=S.sentVerdicts[sid];\n    const myVlbl=myV?lmap[myV]:'(미선택)';\n    const srcTagMap={\n      s1:'<span style=\"background:#fee2e2;color:#991b1b;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;\">출처 없음<\u002Fspan>',\n      s2:'<span style=\"background:#e0e4fb;color:#33299e;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;\">뉴스<\u002Fspan>',\n      s3:'<span style=\"background:#dcfce7;color:#166534;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;\">국립기관<\u002Fspan>',\n      s4:'<span style=\"background:#e0e4fb;color:#33299e;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;\">뉴스<\u002Fspan>',\n      s5:'<span style=\"background:#f3e8ff;color:#6b21a8;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;\">학술자료<\u002Fspan>',\n    };\n    const d=document.createElement('div');\n    d.className='sent-rv '+(myV||s.verdict);\n    d.innerHTML=`\n      <div class=\"rv-lbl\">${s.num} ${srcTagMap[sid]||''}<\u002Fdiv>\n      <div style=\"font-size:12px;margin-bottom:6px;line-height:1.5;\">${s.text}<\u002Fdiv>\n      <div style=\"font-size:11px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px;margin-top:4px;display:flex;flex-direction:column;gap:3px;\">\n        ${wasRetried&&firstWrong?`<span style=\"color:var(--muted);\">1차 선택: <s>${firstWrong}<\u002Fs><\u002Fspan>`:''}\n        <span>${resultMark} ${wasRetried?'내 선택 (재도전):':'내 선택:'} <strong>${myTxt}<\u002Fstrong><\u002Fspan>\n        ${!isCorrect?`<span style=\"color:var(--trust);\">💡 정답: ${correctTxt}<\u002Fspan>`:''}\n        <span style=\"margin-top:3px;padding-top:4px;border-top:1px dashed rgba(0,0,0,.08);\">⚖️ 내 판정: <strong>${myVlbl}<\u002Fstrong><\u002Fspan>\n      <\u002Fdiv>`;\n    sg.appendChild(d);\n  });\n\n  if(S.fixText){\n    qs('#fixRptSec').style.display='block';\n    qs('#rptFix').innerHTML=`<div class=\"fix-rpt-ttl\">② 과장된 AI 문장 수리<\u002Fdiv><div class=\"fix-rpt-orig\">${SENTS.s2.fixOriginal}<\u002Fdiv><div class=\"fix-rpt-new\">→ ${S.fixText}<\u002Fdiv>`;\n  }\n\n  qs('#rSc0').textContent=S.sc0;qs('#rR0').textContent=S.reason0;\n  qs('#rSc2').textContent=S.sc2;qs('#rR2').textContent=S.reason2;\n  const diff=S.sc2-S.sc0;const de=qs('#rDiff');\n  if(diff>5){de.className='sc-diff up';de.textContent=`처음보다 ${diff}점 올라갔어요`;}\n  else if(diff<-5){de.className='sc-diff dn';de.textContent=`처음보다 ${Math.abs(diff)}점 내려갔어요`;}\n  else{de.className='sc-diff same';de.textContent='점수가 비슷해요';}\n\n  const vm={\n    trust:{e:'✅',l:'신뢰',d:'출처와 근거를 확인해 보니 믿어도 되겠다고 판단했어요.',c:'vt'},\n    hold:{e:'🤔',l:'보류',d:'일부는 확인됐지만 더 살펴봐야 할 부분이 있어서, 정확히 밝혀지기 전까지 판단을 잠깐 미뤄 두기로 했어요.',c:'vh'},\n    doubt:{e:'⚠️',l:'의심',d:'출처가 없거나 근거가 부족해서, 그대로 믿지 말고 의심해 봐야겠다고 판단했어요.',c:'vd'}\n  }[S.verdict];\n  const ve=qs('#rVerdict');ve.className='vrpt '+vm.c;\n  ve.innerHTML=`<div class=\"vrpt-e\">${vm.e}<\u002Fdiv><div class=\"vrpt-l\">${vm.l}<\u002Fdiv><div class=\"vrpt-d\">${vm.d}<\u002Fdiv><div style=\"margin-top:6px;font-size:12px;color:var(--muted)\">소감: ${S.reasonV}<\u002Fdiv>`;\n\n  const hard=(\n    ORDER.find(id=>S.retried[id]) ||\n    ORDER.find(id=>S.answers[id]==='wrong') ||\n    ORDER.find(id=>SENTS[id].verdict==='hold') ||\n    ORDER[0]\n  );\n  qs('#rHardest').textContent=`${SENTS[hard].num} \"${SENTS[hard].text}\" — ${SENTS[hard].fbKey}`;\n\n  const pl=document.createElement('ul');\n  pl.style.cssText='margin:4px 0;padding-left:18px;';\n  (S.promises||[]).forEach(p=>{\n    const li=document.createElement('li');\n    li.style.cssText='font-size:13px;line-height:1.8;';\n    li.textContent=p;\n    pl.appendChild(li);\n  });\n  qs('#rPromise').innerHTML='';\n  qs('#rPromise').appendChild(pl);\n}\n\nfunction printReport(){\n  const src=qs('#rptWrap');if(!src){toast('보고서를 먼저 만들어주세요!');return;}\n  const ov=qs('#printOverlay');if(ov&&ov.parentElement!==document.body)document.body.appendChild(ov);\n  qs('#printContent').innerHTML='';qs('#printContent').appendChild(src.cloneNode(true));\n  qs('#printOverlay').classList.add('show');qs('#printOverlay').scrollTop=0;\n}\nfunction closePrint(){qs('#printOverlay').classList.remove('show');}\n\n// 인라인 onclick 문자열에서 참조하는 함수들을 전역으로 노출\nwindow.startApp=startApp;\nwindow.goHunt=goHunt;\nwindow.openSrcTag=openSrcTag;\nwindow.closeSrcDropdown=closeSrcDropdown;\nwindow.confirmSrc=confirmSrc;\nwindow.updSc=updSc;\nwindow.cc=cc;\nwindow.selV=selV;\nwindow.goVerdict=goVerdict;\nwindow.goPromise=goPromise;\nwindow.makeReport=makeReport;\nwindow.printReport=printReport;\nwindow.closePrint=closePrint;\nwindow.pickVerdict=pickVerdict;\nwindow.repickVerdict=repickVerdict;\nwindow.nextSent=nextSent;\n\nshowSt(0);\n\n// ── 자동저장 · 이어하기 (v18) ──\nconst SAVE_KEY='aiDetective_save_v18';\nconst FORM_IDS=['sc0','ta0','sc2','ta2','taV','promiseCustom','fixTa'];\nlet lastForm={};\nfunction lsGet(){try{const r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}\nfunction lsClear(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}\nfunction saveNow(){\n  if(qs('#coverWrap').style.display!=='none')return;\n  FORM_IDS.forEach(id=>{const el=qs('#'+id);if(el)lastForm[id]=el.value;});\n  lastForm.promiseChecks=[...document.querySelectorAll('.promise-select input[type=checkbox]')].map(c=>c.checked);\n  try{localStorage.setItem(SAVE_KEY,JSON.stringify({S,STAT,form:lastForm,t:Date.now()}));}catch(e){}\n}\ndocument.addEventListener('input',saveNow);\ndocument.addEventListener('change',saveNow);\ndocument.addEventListener('click',()=>setTimeout(saveNow,0),true);\n\nfunction resetApp(){\n  if(!confirm('지금까지 기록한 내용이 모두 지워져요. 처음부터 다시 할까요?'))return;\n  lsClear();location.reload();\n}\nfunction setVal(id,v,cid){const el=qs('#'+id);if(!el||v==null)return;el.value=v;if(cid&&qs('#'+cid))qs('#'+cid).textContent=String(v).length;}\n\nfunction restoreApp(d){\n  Object.assign(S,d.S||{});\n  STAT=Object.assign({det:0,care:{}},d.STAT||{});\n  lastForm=d.form||{};\n  ['answers','choiceTxt','firstWrongTxt','srcConfirmed','sentVerdicts','verdictRetried','retried'].forEach(k=>{if(!S[k])S[k]={};});\n  // 판정까지 끝나지 않은 문장은 처음부터 다시 풀도록 되돌림\n  ORDER.forEach(sid=>{if(!S.sentVerdicts[sid]){delete S.answers[sid];delete S.choiceTxt[sid];delete S.firstWrongTxt[sid];delete S.retried[sid];delete S.verdictRetried[sid];}});\n  STAT.det=Math.min(DET_MAX,DET_PER*ORDER.filter(id=>S.answers[id]&&S.answers[id]!=='wrong').length);\n  const f=lastForm;\n  setVal('sc0',f.sc0);if(f.sc0!=null)qs('#sb0').textContent=f.sc0;\n  setVal('ta0',f.ta0,'c0');\n  setVal('sc2',f.sc2);if(f.sc2!=null)qs('#sb2').textContent=f.sc2;\n  setVal('ta2',f.ta2,'c2');\n  setVal('taV',f.taV,'cV');\n  setVal('promiseCustom',f.promiseCustom);\n  if(f.promiseChecks)document.querySelectorAll('.promise-select input[type=checkbox]').forEach((c,i)=>{c.checked=!!f.promiseChecks[i];});\n  ORDER.forEach(sid=>{if(S.srcConfirmed[sid]){const tg=qs('#srctag-'+sid);if(tg)tg.classList.add('read');}});\n  if(S.verdict){const vb=document.querySelector('.vbtn[data-v=\"'+S.verdict+'\"]');if(vb)vb.classList.add('sel');}\n  qs('#coverWrap').style.display='none';\n  let st=S.stage||0;\n  if(st>=1){\n    qs('#aiPanel').classList.add('hunt');\n    const bl=qs('#srcBadgeList');if(bl)bl.style.display='block';\n    const sc=qs('#sideCard');if(sc)sc.style.display='block';\n    qs('#statBar').classList.add('show');\n  }\n  if(st===1){\n    const idx=ORDER.findIndex(id=>!S.sentVerdicts[id]);\n    if(idx>=0){showSt(1);renderSent(idx);}\n    else{st=2;}\n  }\n  if(st>=2){ORDER.forEach(id=>{const el=qs('#hl-'+id);if(el){el.classList.remove('active');el.classList.add('done');}});}\n  if(st===2){qs('#echo0').textContent=S.sc0;showSt(2);}\n  else if(st===3){buildResultSummary();showSt(3);}\n  else if(st===35){buildResultSummary();showSt(3);qs('#st3').style.display='none';S.stage=35;qs('#st35').style.display='block';}\n  else if(st===4){buildReport();showSt(4);}\n  else if(st===0){showSt(0);}\n  updateStatBar();\n  toast('저장된 활동을 이어서 해요!');\n}\n\n(function setupResume(){\n  const d=lsGet();\n  if(!d||!d.S)return;\n  const hasWork=(d.S.stage||0)>=1||(d.form&&d.form.ta0);\n  if(!hasWork)return;\n  const wrap=qs('.cover-search-wrap');\n  const tm=new Date(d.t||Date.now());\n  const when=`${tm.getMonth()+1}월 ${tm.getDate()}일 ${tm.getHours()}:${String(tm.getMinutes()).padStart(2,'0')}`;\n  const stageName={0:'활동 1',1:'활동 2',2:'활동 3',3:'활동 4',35:'나의 약속',4:'탐정 보고서'}[d.S.stage||0]||'';\n  const box=document.createElement('div');box.className='resume-box';\n  box.innerHTML=`<div class=\"resume-ttl\">💾 하던 활동이 저장되어 있어요<\u002Fdiv>\n    <div class=\"resume-sub\">${stageName} 진행 중 · ${when} 저장<\u002Fdiv>\n    <div class=\"resume-btns\">\n      <button class=\"btn-p\" id=\"resumeBtn\">이어서 하기 →<\u002Fbutton>\n      <button class=\"btn-s\" id=\"freshBtn\">처음부터 새로 하기<\u002Fbutton>\n    <\u002Fdiv>`;\n  wrap.parentElement.insertBefore(box,wrap);\n  wrap.style.display='none';\n  qs('#resumeBtn').onclick=()=>restoreApp(d);\n  qs('#freshBtn').onclick=()=>{if(!confirm('저장된 기록이 지워져요. 새로 시작할까요?'))return;lsClear();box.remove();wrap.style.display='';startApp();};\n})();\nwindow.resetApp=resetApp;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
